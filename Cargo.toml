[package]
name = "datamocker"
version = "0.1.0"
edition = "2021"
description = "A high-performance, extensible database mock data generation tool"
license = "MIT"

[[bin]]
name = "datamocker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "json",
    "chrono",
    "uuid",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
fake = { version = "2.9", features = ["derive", "chrono", "uuid"] }
indicatif = "0.17"
serde_yaml = "0.9"
once_cell = "1.21.4"
num_cpus = "1.16"
sys-info = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
